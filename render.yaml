# Render Blueprint — LinQi API (optional)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: linqi-api
    runtime: node
    plan: free
    buildCommand: pnpm run render:build
    startCommand: pnpm run render:start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEFAULT_ADMIN
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: linqi-db
          property: connectionString
databases:
  - name: linqi-db
    databaseName: linqi_db
    user: linqi_db_user
    plan: free
