kind = "web"
previewPath = "/"
title = "سیستەمی فرۆشتن و قەرزەکان"
version = "1.0.0"
id = "artifacts/kurdish-pos"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20017

[services.development]
run = "pnpm --filter @workspace/kurdish-pos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kurdish-pos", "run", "build" ]
publicDir = "artifacts/kurdish-pos/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20017"
BASE_PATH = "/"
